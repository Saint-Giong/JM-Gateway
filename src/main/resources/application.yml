spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true

server:
  port: 8072
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: password
    key-store-type: PKCS12
    key-alias: 1

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_INSTANCE_HOSTNAME:localhost}:8070/eureka/

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Authentication Service
        url: /v1/auth/api-docs
      - name: Profile Service
        url: /v1/profile/api-docs
      - name: Applicant Discovery Service
        url: /v1/discovery/api-docs
      - name: Media Service
        url: /v1/media/api-docs
      - name: Job Post Service
        url: /v1/jobpost/api-docs
      - name: Subscription Service
        url: /v1/subscription/api-docs
      - name: Skill Tag Service
        url: /v1/tag/api-docs
